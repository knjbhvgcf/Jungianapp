    <script type="application/ld+json">
      {
        "@context": "https://schema.org",

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What are Jung’s cognitive functions?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Carl Jung’s Psychological Types describes four functions — thinking, feeling, sensation, and intuition — each introverted or extraverted. This quiz also uses John Beebe’s eight-function archetypal model."
            }
          },
          {
            "@type": "Question",
            "name": "Is this the official MBTI test?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. This is a free educational quiz inspired by Jung’s functions and is not affiliated with the Myers-Briggs Type Indicator."
            }
          },
          {
            "@type": "Question",
            "name": "Do you store my answers?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Answers stay in your browser session and are never sent to a server."

          }
        ]
